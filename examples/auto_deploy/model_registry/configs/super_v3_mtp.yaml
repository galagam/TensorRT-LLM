# Config for SuperV3 with MTP speculative decoding.
#
runtime: trtllm
compile_backend: torch-cudagraph
max_batch_size: 128
max_seq_len: 65536 # tunable
enable_chunked_prefill: false # TODO: Support chunked prefill w/ spec dec
attn_backend: trtllm
model_factory: AutoModelForCausalLM
skip_loading_weights: false
cuda_graph_config:
  batch_sizes: [1, 2, 4, 8, 16, 24, 32, 64, 128]
kv_cache_config:
  # tunable mamba cache dtype
  # --> use float32 for accuracy and default (auto) for speed
  mamba_ssm_cache_dtype: auto
speculative_config:
  decoding_type: MTP
  num_nextn_predict_layers: 6
  mtp_eagle_one_model: true
  # draft_len_schedule: reduce draft tokens at high concurrency to keep MTP step time competitive.
  # Semantics: each key is an upper-bound batch size; value is draft_len for batch sizes UP TO that key.
  # Key 8 must equal num_nextn_predict_layers (max_draft_len) per config validator.
  # At conc>=65: MTP is behind no-MTP regardless of draft_len; schedule stops at bs=128.
  draft_len_schedule:
    8: 6    # bs  1- 8: 6 drafts (7 tokens/seq) — spec dec dominates at low conc
    32: 5   # bs  9-32: 5 drafts (6 tokens/seq) — mild reduction
    64: 3   # bs 33-64: 3 drafts (4 tokens/seq) — step time ~40ms, closer to no-MTP ~12ms
    128: 2  # bs 65-128: 2 drafts (3 tokens/seq) — step time ~37ms vs no-MTP ~16ms
transforms:
  detect_sharding:
    allreduce_strategy: NCCL
    # NOTE: add 'tp' to sharding dims only for high-throughput runs
    # For low-latency, keep mamba and attention replicated
    sharding_dims: ['ep', 'bmm']
    # NOTE: sharding_source applies only to TP sharding
    sharding_source: ['manual']
    manual_config:
      head_dim: 128
      tp_plan:
        # mamba SSM layer
        "in_proj": "mamba"
        "out_proj": "rowwise"
        # attention layer
        "q_proj": "colwise"
        "k_proj": "colwise"
        "v_proj": "colwise"
        "o_proj": "rowwise"
        # moe layer: SHARED experts
        "up_proj": "colwise"
        "down_proj": "rowwise"
        # MoLE: latent projections: simple shard
        "fc1_latent_proj": "gather"
        "fc2_latent_proj": "gather"
  # multi_stream_moe disabled - creates NaNs in target's sampled logits. TODO: investigate + fix
  multi_stream_moe:
    stage: compile
    enabled: false
  fuse_mamba_a_log:
    stage: post_load_fusion
    enabled: true
  # Triton SSM + causal conv are required for MTP as currently they are the only backends
  # that support speculative mamba state caching.
  insert_cached_ssm_attention:
    backend: triton_ssm
  insert_cached_causal_conv:
    backend: triton_causal_conv
  fuse_nvfp4_moe:
    backend: trtllm_gen
  fuse_fp8_moe:
    allow_different_input_scales: true
