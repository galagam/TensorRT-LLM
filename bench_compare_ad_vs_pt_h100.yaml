# Benchmark comparison: AutoDeploy vs PyTorch backend (H100 80GB)
# NVFP4 models excluded (B200/GB200 only).
# Run with: python bench_compare.py --config bench_compare_ad_vs_pt_h100.yaml

workloads:
  - model: nvidia/Llama-3.1-8B-Instruct-FP8
    world_size: 2
    isl: 1024
    osl: 1024
    concurrencies: [16, 64, 256]

  - model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
    world_size: 4
    isl: 1024
    osl: 1024
    concurrencies: [16, 64, 256]

  - model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
    world_size: 8
    isl: 1024
    osl: 1024
    concurrencies: [16, 64, 256]

  - model: nvidia/Llama-3.3-70B-Instruct-FP8
    world_size: 8
    isl: 1024
    osl: 1024
    concurrencies: [16, 64, 256]

  - model: openai/gpt-oss-120b
    world_size: 8
    isl: 1024
    osl: 1024
    concurrencies: [16, 64, 256]

  - model: Qwen/Qwen3-30B-A3B
    world_size: 8
    isl: 1024
    osl: 1024
    concurrencies: [16, 64, 256]

  - model: deepseek-ai/DeepSeek-R1-0528
    world_size: 8
    isl: 1024
    osl: 1024
    concurrencies: [16, 64, 256]

metrics:
  - output_token_throughput
  - output_token_throughput_per_user
